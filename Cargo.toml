[package]
authors = ["Flightless <pelapi@qq.com>"]
edition = "2021"
name = "dioxus-page"
version = "0.2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

dioxus = {version = "0.6.3", features = ["router", "fullstack"]}
futures = "0.3.31"
reqwest = "0.12.15"
serde = "1.0.219"

[features]
default = ["web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
ssg = []
web = ["dioxus/web"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
